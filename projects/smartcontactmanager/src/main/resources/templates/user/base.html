<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="Layout(content)">
<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">

<!-- Bootstrap CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
	integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
	crossorigin="anonymous">

<link rel="stylesheet" th:href="@{/css/style.css}" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
	integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
	crossorigin="anonymous" referrerpolicy="no-referrer">

<title th:text="${title}">Base Html</title>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
		<a class="navbar-brand ml-2" th:href="@{/}">Smart Contact Manager</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse"
			data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false"
			aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<ul class="navbar-nav ml-auto">

				<li class="nav-item active"><a class="nav-link"
					th:text="'Welcome, ' + ${user.Name}"></a></li>

				<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>

			</ul>

		</div>
	</nav>



	<div class="sidebar">
		
		<span onclick="toggleSidebar()" class= "crossBtn">&times</span>
		
		<a href="#" th:href="@{/user/dashboard}" class="items"><i class="fa-solid fa-house-user mr-1"></i>
			Home</a> <a href="#" class="items"> <i class="fa-solid fa-user mr-1"></i>
			My Profile
		</a> <a href="#" class="items"> <i
			class="fa-solid fa-address-book mr-1"></i> View Contacts
		</a> <a th:href="@{/user/add-contact}" class="items"> <i class="fa-solid fa-user-plus mr-1"></i>
			Add New Contact
		</a> <a href="#" th:href="@{/logout}" class="items"> <i
			class="fa-solid fa-right-from-bracket mr-1"></i> Logout
		</a>

		<div class="divider"></div>

	</div>


	<div class="content mt-2">
			<i onclick="toggleSidebar()" id="sidebarIcon" class="fas fa-bars fa-lg mx-2"></i>
		<div th:replace="${content}"></div>

	</div>


	<!-- Optional JavaScript -->
	<!-- jQuery first, then Popper.js, then Bootstrap JS -->
	<script src="../script/script.js"></script>
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
		integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
		integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
		integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
		crossorigin="anonymous"></script>
</body>
</html>
