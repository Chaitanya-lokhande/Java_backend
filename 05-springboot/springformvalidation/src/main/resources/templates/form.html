<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>
<body>

	<div class="container">
		<div class="row mt-5">
			<div class="col-md-6 offset-md-3">
				<h1>Sign In...</h1>
				<form th:action="@{/process}" method="post"
					th:object="${loginDetails}">
					<div class="mb-3 mt-4">
						<label for="inputUserName" class="form-label">Enter
							UserName</label> <input name="userName"
							th:value="${loginDetails.userName}" 
							th:classappend="${#fields.hasErrors('userName')?'is-invalid':''}"
							type="text"
							class="form-control" id="inputUserName"
							aria-describedby="emailHelp">

						<div th:each="e : ${#fields.errors('userName')}" th:text="${e}" id="validationServerUsernameFeedback"
							class="invalid-feedback"></div>

					</div>

					<div class="mb-3">
						<label for="inputUserEmail" class="form-label">Enter Email</label>
						<input name="userEmail" 
						th:value="${loginDetails.userEmail}"
						th:classappend="${#fields.hasErrors('userEmail')?'is-invalid':''}"
						type="email" 
						class="form-control" 
						id="inputUserEmail">
						
						<div th:each="e : ${#fields.errors('userEmail')}" th:text="${e}" id="validationServerUsernameFeedback"
							class="invalid-feedback"></div>
					</div>

					<div class="mb-3 form-check">
						<input type="checkbox" class="form-check-input" id="exampleCheck1">
						<label class="form-check-label" for="exampleCheck1">I
							accept Terms and Conditions</label>
					</div>

					<button type="submit" class="btn btn-primary">Submit</button>
				</form>

			</div>
		</div>
	</div>




</body>
</html>
